name: oncognn

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.13
  - numpy
  - pandas
  - scipy
  - scikit-learn=1.8.0
  - matplotlib
  - seaborn=0.13.2
  - networkx
  - python-igraph
  - pip

  - pip:
      - torch==2.10.0
      - torch-geometric==2.7.0
      - pytorch-lightning
      - node2vec
      - wandb
